name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew
      - name: Build and stage the versioned JAR
        run: node scripts/build-java.js
      - uses: actions/upload-artifact@v4
        with:
          name: modernkit-${{ github.sha }}
          path: dist/modernkit-*.jar
      - name: Commit the built JAR to dist
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist/
          if git diff --cached --quiet; then
            echo "No dist changes to publish."
          else
            git commit -m "Publish ModernKit build [skip ci]"
            git push
          fi
